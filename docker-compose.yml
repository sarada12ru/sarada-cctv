services:
  cctv:
    build: .
    container_name: sarada-cctv
    restart: unless-stopped
    ports:
      - "192.168.31.122:8098:80"
    volumes:
      - ./.secrets/htpasswd:/etc/nginx/auth/htpasswd:ro
    networks:
      - cctv_private
networks:
  cctv_private:
    external: true
    name: cctv_private
