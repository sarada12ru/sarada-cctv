server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic auth applies to the entire viewer, including stream proxy.
    auth_basic "Sarada CCTV - Private";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only the go2rtc player assets and playback endpoints are proxied.
    # Do not expose /api/streams, /api/config, /api/exit, etc.
    location = /go2rtc/stream.html {
        proxy_pass http://daichi-go2rtc:1984/stream.html;
        proxy_set_header Host $host;
    }
    location = /go2rtc/video-rtc.js {
        proxy_pass http://daichi-go2rtc:1984/video-rtc.js;
        proxy_set_header Host $host;
    }
    location = /video-rtc.js {
        proxy_pass http://daichi-go2rtc:1984/video-rtc.js;
        proxy_set_header Host $host;
    }
    location = /api/ws {
        proxy_pass http://daichi-go2rtc:1984/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location ~ ^/api/stream\.(mp4|m3u8|m4s|ts)$ {
        proxy_pass http://daichi-go2rtc:1984;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
    location = /api/frame.jpeg {
        proxy_pass http://daichi-go2rtc:1984/api/frame.jpeg;
    }
    location ^~ /api/ { return 404; }
    location ^~ /go2rtc/ { return 404; }
}
