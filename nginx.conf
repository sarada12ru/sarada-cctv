server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;

    # Only the WebRTC signaling endpoint is proxied. Do NOT expose /api/streams,
    # /api/config, the go2rtc dashboard, or any other management endpoint.
    location = /api/webrtc {
        limit_except POST { deny all; }
        if ($arg_src !~ ^(daichi_sub|daichi_main)$) { return 403; }
        proxy_pass http://daichi-go2rtc:1984/api/webrtc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
